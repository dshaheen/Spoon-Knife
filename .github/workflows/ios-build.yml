name: iOS Build

on:
  push:
    paths:
      - "DividendGraph/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "DividendGraph/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project DividendGraph/DividendGraph.xcodeproj \
            -target DividendGraph \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
